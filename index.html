      { id: 25, nombre: "Cistitis", organo: "Vejiga / Mucosa vesical", capa: "Ectodermo", conflicto: "Imposibilidad de marcar los límites del propio territorio.", fase: "Vagotónica (Ardor e inflamación)." },

    // DATOS DE LAS 5 LEYES BIOLÓGICAS APLICADAS EN BIODESCODIFICACIÓN
    const LEYES_BIOLOGICAS_APLICADAS = [
      {
        numero: "1ª Ley",
        titulo: "La Ley de Hierro de la Biología",
        sub: "El Origen: El Impacto Emocional (Bioshock)",
        enunciado: "Todo Programa Biológico Especial (DHS) inicia con un choque traumático inesperado, vivido en soledad y sin solución inmediata.",
        aplicacion: "En consulta, no buscamos el estrés común del día a día, sino el instante preciso del 'Bioshock': un evento imprevisto que tomó por sorpresa al sistema nervioso. Identificar este momento exacto es la clave para desbloquear la carga emocional retenida."
      },
      {
        numero: "2ª Ley",
        titulo: "La Ley del Carácter Bifásico de los Programas Biológicos",
        sub: "Las Dos Fases: Conflicto Activo y Reparación",
        enunciado: "Todo proceso biológico consta de dos fases (siempre que se resuelva el conflicto): Fase Simpaticotónica (Conflicto Activo) y Fase Vagotónica (Solución/Reparación).",
        aplicacion: "Explicamos al consultante en qué fase se encuentra su síntoma. Muchos dolores, inflamaciones o fiebres no son el problema, sino la 'Fase de Reparación' (Vagotónica) donde el cuerpo está sanando. Esto reduce drásticamente el pánico y el miedo al diagnóstico."
      },
      {
        numero: "3ª Ley",
        titulo: "El Sistema Ontogenético de los Programas Biológicos",
        sub: "El Código de los Tejidos y Capas Embrionarias",

      },
      {
        numero: "4ª Ley",
        titulo: "El Sistema Ontogenético de los Microbios",
        sub: "Microbios como Aliados de la Biología",
        enunciado: "Bacterias, hongos y virus no atacan el cuerpo de forma destructiva; actúan como optimizadores ecológicos dirigidos por el cerebro durante la fase de solución.",

      {
        numero: "5ª Ley",
        titulo: "La Quintaesencia (La Ley de la Comprensión Biológica)",
        sub: "El Sentido Biológico del Síntoma",
        enunciado: "Toda enfermedad es un Programa Biológico Especial con Pleno Sentido Adaptativo creado por la naturaleza para garantizar la supervivencia.",

    function App() {
      // Navegación principal: 'escaner' | 'diccionario' | 'metodo' | 'leyes'
      const [tab, setTab] = useState('escaner');

      // Estados del Escáner
      const [paso, setPaso] = useState(1);
      const [sintoma, setSintoma] = useState('');
      const [tiempo, setTiempo] = useState('1 a 6 meses');
      const [intensidad, setIntensidad] = useState(7);
      const [evento, setEvento] = useState('');
      const [sensacion, setSensacion] = useState('Impotencia / No poder actuar');
      const [repetitivo, setRepetitivo] = useState('Sí');
      const [compromiso, setCompromiso] = useState(8);

      // Estados del Diccionario
      const [busqueda, setBusqueda] = useState('');
      const [capaFiltro, setCapaFiltro] = useState('TODAS');
      const [paginaActual, setPaginaActual] = useState(1);
      const itemsPorPagina = 8;

      const PHONE_NUMBER = "56990229732";

      // Persistencia local
      useEffect(() => {
        const savedSintoma = localStorage.getItem('camino_sintoma_v3');
        if (savedSintoma) setSintoma(savedSintoma);
      }, []);

      useEffect(() => {
        localStorage.setItem('camino_sintoma_v3', sintoma);
      }, [sintoma]);

      // Cálculo del Índice de Receptividad
      const receptividad = useMemo(() => {
        let score = 40;
        if (parseInt(intensidad) > 6) score += 20;
        if (evento.length > 10) score += 20;
        if (parseInt(compromiso) > 7) score += 20;
        return Math.min(score, 100);
      }, [intensidad, evento, compromiso]);

      // Filtrado del Diccionario A-Z
      const listaFiltrada = useMemo(() => {
        return BANCO_PES_COMPLETO.filter(item => {
          const coincideTexto = item.nombre.toLowerCase().includes(busqueda.toLowerCase()) ||
                                item.conflicto.toLowerCase().includes(busqueda.toLowerCase()) ||
                                item.organo.toLowerCase().includes(busqueda.toLowerCase());
          const coincideCapa = capaFiltro === 'TODAS' || item.capa.toLowerCase().includes(capaFiltro.toLowerCase());
          return coincideTexto && coincideCapa;
        });
      }, [busqueda, capaFiltro]);

      // Paginación
      const totalPaginas = Math.ceil(listaFiltrada.length / itemsPorPagina) || 1;
      const itemsPaginados = useMemo(() => {
        const inicio = (paginaActual - 1) * itemsPorPagina;
        return listaFiltrada.slice(inicio, inicio + itemsPorPagina);
      }, [listaFiltrada, paginaActual]);

      // Evaluar un síntoma desde el diccionario en el Escáner
      const evaluarEnEscaner = (nombreSintoma) => {
        setSintoma(nombreSintoma);
        setTab('escaner');
        setPaso(1);
        window.scrollTo({ top: 0, behavior: 'smooth' });

      const enviarWhatsApp = () => {
        const text = `*FICHA DE ESCÁNER BIOEMOCIONAL - CAMINO AL INCONSCIENTE*%0A%0A` +
          `*1. Síntoma / Diagnóstico:* ${sintoma || 'No especificado'}%0A` +
          `*2. Duración:* ${tiempo}%0A` +
          `*3. Nivel de Estrés:* ${intensidad}/10%0A` +
          `*4. Evento / Bioshock:* ${evento || 'No detallado'}%0A` +
          `*5. Vivencia Inconsciente:* ${sensacion}%0A` +
          `*6. Patrón Repetitivo:* ${repetitivo}%0A` +
          `*7. Compromiso de Cambio:* ${compromiso}/10%0A` +
          `*8. Índice de Receptividad:* ${receptividad}%25%0A%0A` +
          `Hola Mario, he completado mi Escáner Bioemocional en el portal y deseo coordinar mi sesión privada 1 a 1.`;

        window.open(`https://wa.me/${PHONE_NUMBER}?text=${text}`, '_blank');
      };

      return (
        <div className="max-w-4xl mx-auto px-4 py-8">
          
          {/* HEADER PRINCIPAL CLEAN PREMIUM */}
          <header className="text-center mb-8 bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-sm">
            <a href="https://caminoalinconsciente.cl/" target="_blank" rel="noopener noreferrer" className="inline-block transition-transform hover:scale-[1.02]">
              <div className="text-center">
                <span className="text-xs font-bold tracking-[0.25em] text-blue-600 uppercase block mb-1">
                  Mario Paredes · Biodescodificación
                </span>
                <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
                  Portal Camino Al Inconsciente
                </h1>
                <p className="text-slate-500 text-xs sm:text-sm mt-2 max-w-xl mx-auto font-normal">

          {/* BARRA DE PESTAÑAS PRINCIPAL */}

              className={`flex-1 min-w-[140px] py-3 px-3 rounded-xl font-bold text-xs sm:text-sm transition-all duration-200 flex items-center justify-center gap-1.5 ${
                tab === 'escaner'
                  ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20'
                  : 'text-slate-600 hover:bg-slate-50'
              }`}
            >
              <span>✨</span> Escáner Bioemocional
            </button>

            <button
              onClick={() => setTab('diccionario')}
              className={`flex-1 min-w-[140px] py-3 px-3 rounded-xl font-bold text-xs sm:text-sm transition-all duration-200 flex items-center justify-center gap-1.5 ${
                tab === 'diccionario'
                  ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20'
                  : 'text-slate-600 hover:bg-slate-50'
              }`}
            >
              <span>📖</span> Diccionario PES
            </button>

            <button
              onClick={() => setTab('leyes')}
              className={`flex-1 min-w-[140px] py-3 px-3 rounded-xl font-bold text-xs sm:text-sm transition-all duration-200 flex items-center justify-center gap-1.5 ${
                tab === 'leyes'

            >
              <span>🧬</span> Las 5 Leyes Biológicas
            </button>

              className={`flex-1 min-w-[140px] py-3 px-3 rounded-xl font-bold text-xs sm:text-sm transition-all duration-200 flex items-center justify-center gap-1.5 ${

                  ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20'

              <span>🌱</span> Método & Sesión

          {/* PESTAÑA 1: ESCÁNER BIOEMOCIONAL */}

            <div className="bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-sm space-y-6">
              
              {/* Progreso */}
              <div>
                <div className="flex justify-between text-xs font-bold text-blue-600 uppercase tracking-wider mb-2">
                  <span>Paso {paso} de 4</span>
                  <span>{paso * 25}% Completado</span>
                </div>
                <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                  <div 
                    className="bg-blue-600 h-full transition-all duration-300"
                    style={{ width: `${paso * 25}%` }}
                  ></div>
                </div>
              </div>

              {/* PASO 1 */}
              {paso === 1 && (
                <div className="space-y-5">
                  <h2 className="text-xl font-bold text-slate-900">
                    1. Identificación del Síntoma o Diagnóstico
                  </h2>
                  <p className="text-xs sm:text-sm text-slate-500 leading-relaxed">
                    Ingresa el síntoma físico, diagnóstico médico u obstáculo repetido que deseas explorar.
                  </p>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                      Síntoma o Situación de Estrés
                    </label>
                    <input
                      type="text"
                      value={sintoma}
                      onChange={(e) => setSintoma(e.target.value)}
                      placeholder="Ej: Colon irritable, migraña, dolor lumbar, hipertensión..."
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                      ¿Hace cuánto tiempo se manifiesta?
                    </label>
                    <select
                      value={tiempo}
                      onChange={(e) => setTiempo(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                      <option>Menos de 1 mes</option>
                      <option>1 a 6 meses</option>
                      <option>6 meses a 2 años</option>
                      <option>Más de 2 años (crónico)</option>
                    </select>
                  </div>

                  <button
                    disabled={!sintoma.trim()}
                    onClick={() => setPaso(2)}
                    className="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-all shadow-md disabled:opacity-50 disabled:cursor-not-allowed"
                  >
                    Siguiente Paso →
                  </button>
                </div>
              )}

              {/* PASO 2 */}
              {paso === 2 && (
                <div className="space-y-5">
                  <h2 className="text-xl font-bold text-slate-900">
                    2. Nivel de Estrés e Impacto
                  </h2>

                  <div>
                    <div className="flex justify-between items-center mb-2">
                      <label className="text-xs font-bold text-slate-700 uppercase tracking-wider">
                        Nivel de estrés de 1 a 10
                      </label>
                      <span className="text-blue-600 font-extrabold text-lg">{intensidad}/10</span>
                    </div>
                    <input
                      type="range"
                      min="1"
                      max="10"
                      value={intensidad}
                      onChange={(e) => setIntensidad(e.target.value)}
                      className="w-full accent-blue-600 cursor-pointer h-2 bg-slate-100 rounded-lg"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                      ¿Qué evento o vivencia imprevista ocurrió cuando comenzó el síntoma?
                    </label>
                    <textarea
                      value={evento}
                      onChange={(e) => setEvento(e.target.value)}
                      rows="3"
                      placeholder="Describe brevemente la situación de estrés o conflicto..."
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    ></textarea>
                  </div>

                  <div className="flex gap-3">
                    <button
                      onClick={() => setPaso(1)}
                      className="flex-1 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl"
                    >
                      ← Atrás
                    </button>
                    <button
                      onClick={() => setPaso(3)}
                      className="flex-2 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl px-8 shadow-md"
                    >
                      Siguiente Paso →
                    </button>
                  </div>
                </div>
              )}

              {/* PASO 3 */}
              {paso === 3 && (
                <div className="space-y-5">
                  <h2 className="text-xl font-bold text-slate-900">
                    3. Vivencia Emocional e Inconsciente
                  </h2>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                      Sentimiento predominante inconsciente
                    </label>
                    <select
                      value={sensacion}
                      onChange={(e) => setSensacion(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                      <option>Impotencia / No poder actuar</option>
                      <option>Miedo o amenaza en el territorio</option>
                      <option>Desvalorización personal</option>
                      <option>Separación / Pérdida de contacto</option>
                      <option>Situación sucia o indigerible</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                      ¿Sientes que este patrón se ha repetido en tu historia personal o familiar?
                    </label>
                    <div className="flex gap-3">
                      {['Sí', 'No', 'No estoy seguro/a'].map((op) => (
                        <button
                          key={op}
                          type="button"
                          onClick={() => setRepetitivo(op)}
                          className={`flex-1 py-3 rounded-xl border text-xs sm:text-sm font-bold transition-all ${
                            repetitivo === op
                              ? 'border-blue-600 bg-blue-50 text-blue-700'
                              : 'border-slate-200 bg-slate-50 text-slate-600'
                          }`}
                        >
                          {op}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="flex gap-3">
                    <button
                      onClick={() => setPaso(2)}
                      className="flex-1 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl"
                    >
                      ← Atrás
                    </button>
                    <button
                      onClick={() => setPaso(4)}
                      className="flex-2 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl px-8 shadow-md"
                    >
                      Ver Diagnóstico Bioemocional →
                    </button>
                  </div>
                </div>
              )}

              {/* PASO 4: RESULTADO DE ESCÁNER */}
              {paso === 4 && (
                <div className="space-y-6 text-center">
                  <div className="inline-block p-4 bg-emerald-50 text-emerald-600 rounded-full mb-1">
                    <span className="text-3xl">✨</span>
                  </div>

                  <h2 className="text-2xl font-bold text-slate-900">
                    Escaneo Bioemocional Completado
                  </h2>

                  <div className="bg-slate-50 border border-slate-200 rounded-2xl p-6 text-left space-y-3">
                    <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                      <span className="text-slate-500 text-xs uppercase font-bold tracking-wider">
                        Índice de Receptividad Bioemocional
                      </span>
                      <span className="text-2xl font-extrabold text-blue-600">{receptividad}%</span>
                    </div>

                    <div className="space-y-2 text-xs sm:text-sm text-slate-700 pt-1">
                      <p><strong className="text-slate-900">Síntoma:</strong> {sintoma}</p>
                      <p><strong className="text-slate-900">Tiempo:</strong> {tiempo}</p>
                      <p><strong className="text-slate-900">Nivel de Estrés:</strong> {intensidad}/10</p>
                      <p><strong className="text-slate-900">Vivencia:</strong> {sensacion}</p>

                  </div>

                  <div className="flex flex-col sm:flex-row gap-3 pt-2">
                    <button
                      onClick={enviarWhatsApp}

                      <span>💬</span> Enviar Ficha a WhatsApp (+56 9 9022 9732)
                    </button>

                    <a
                      href="https://caminoalinconsciente.cl/"
                      target="_blank"
                      rel="noopener noreferrer"
                      className="flex-1 py-4 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold rounded-xl transition-all flex items-center justify-center gap-2 border border-slate-200 text-xs sm:text-sm"

                      <span>🔗</span> Ir a Camino Al Inconsciente
                    </a>
                  </div>

                  <button
                    onClick={() => setPaso(1)}
                    className="text-xs text-slate-400 hover:text-slate-600 underline pt-2 block mx-auto"
                  >
                    Realizar otro Escaneo
                  </button>
                </div>
              )}

            </div>
          )}

          {/* PESTAÑA 2: DICCIONARIO PES (A-Z COMPLETO) */}

            <div className="space-y-6">
              
              {/* Buscador y Filtro */}
              <div className="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm space-y-4">
                <input
                  type="text"
                  value={busqueda}
                  onChange={(e) => { setBusqueda(e.target.value); setPaginaActual(1); }}
                  placeholder="Buscar por síntoma, órgano o conflicto (ej: Gastritis, Piel, Rabia, Colon)..."

                />

                <div className="flex flex-wrap items-center gap-2 pt-1">
                  <span className="text-xs font-bold text-slate-400 uppercase tracking-wider mr-2">Capa Embrionaria:</span>
                  {['TODAS', 'Endodermo', 'Mesodermo', 'Ectodermo'].map((capa) => (
                    <button
                      key={capa}
                      onClick={() => { setCapaFiltro(capa); setPaginaActual(1); }}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                        capaFiltro === capa
                          ? 'bg-blue-600 text-white shadow-sm'
                          : 'bg-slate-100 text-slate-600 hover:bg-slate-200'

                      {capa}
                    </button>
                  ))}
                </div>
              </div>

              {/* Grid de Enfermedades */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {itemsPaginados.map((item) => (
                  <div key={item.id} className="bg-white border border-slate-200 hover:border-blue-400 rounded-2xl p-5 flex flex-col justify-between shadow-sm transition-all">
                    <div className="space-y-2.5">
                      <div className="flex justify-between items-start">
                        <h3 className="text-base font-bold text-slate-900">{item.nombre}</h3>
                        <span className="text-[10px] uppercase font-extrabold bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded-md">
                          {item.capa}
                        </span>
                      </div>

                      <p className="text-xs text-slate-500">
                        <strong className="text-slate-700">Órgano Afectado:</strong> {item.organo}
                      </p>

                      <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <span className="text-[11px] font-bold text-blue-600 uppercase tracking-wider block mb-0.5">Conflicto Psicológico:</span>
                        <p className="text-xs text-slate-700 leading-relaxed">{item.conflicto}</p>
                      </div>

                      <p className="text-xs text-slate-500">
                        <strong className="text-slate-700">Fase del Síntoma:</strong> {item.fase}
                      </p>
                    </div>

                    <div className="pt-4 mt-2 border-t border-slate-100">
                      <button
                        onClick={() => evaluarEnEscaner(item.nombre)}
                        className="w-full py-2.5 bg-slate-900 hover:bg-blue-600 text-white font-bold rounded-xl text-xs transition-colors flex items-center justify-center gap-2"
                      >
                        Evaluar en Escáner Bioemocional →
                      </button>
                    </div>
                  </div>
                ))}
              </div>

              {/* Paginación */}
              {totalPaginas > 1 && (
                <div className="flex justify-center items-center gap-3 pt-4">
                  <button
                    disabled={paginaActual === 1}
                    onClick={() => setPaginaActual(p => Math.max(p - 1, 1))}
                    className="px-4 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-700 disabled:opacity-40 shadow-sm"
                  >
                    Anterior
                  </button>
                  <span className="text-xs text-slate-500 font-medium">
                    Página {paginaActual} de {totalPaginas}
                  </span>
                  <button
                    disabled={paginaActual === totalPaginas}
                    onClick={() => setPaginaActual(p => Math.min(p + 1, totalPaginas))}
                    className="px-4 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-700 disabled:opacity-40 shadow-sm"
                  >
                    Siguiente
                  </button>
                </div>
              )}

            </div>
          )}

          {/* PESTAÑA 3: LAS 5 LEYES BIOLÓGICAS Y SU APLICACIÓN */}
          {tab === 'leyes' && (
            <div className="space-y-6">
              
              {/* INTRODUCCIÓN A LAS LEYES BIOLÓGICAS */}
              <div className="bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-sm space-y-3">
                <span className="text-xs font-bold tracking-widest text-blue-600 uppercase block">
                  Fundamento Científico y Biológico
                </span>
                <h2 className="text-xl sm:text-2xl font-bold text-slate-900">
                  ¿Cómo Usamos las 5 Leyes Biológicas en Biodescodificación?
                </h2>
                <p className="text-xs sm:text-sm text-slate-600 leading-relaxed">
                  Las 5 Leyes Biológicas nos muestran que la enfermedad no es un fallo del organismo ni un castigo, sino un <strong className="text-slate-900">Programa Biológico Especial con Pleno Sentido Adaptativo</strong>. En nuestro método de acompañamiento, utilizamos este modelo biológico para comprender el código exacto que activó la respuesta de tu cuerpo.
                </p>
              </div>

              {/* LISTADO INTERACTIVO DE LAS LEYES */}
              <div className="space-y-4">
                {LEYES_BIOLOGICAS_APLICADAS.map((ley, index) => (
                  <div key={index} className="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-extrabold uppercase px-3 py-1 bg-blue-50 text-blue-700 rounded-lg border border-blue-100">
                        {ley.numero}
                      </span>
                      <span className="text-[11px] font-medium text-slate-400">
                        Ley Biológica #{index + 1}
                      </span>
                    </div>

                    <div>
                      <h3 className="text-lg font-bold text-slate-900">{ley.titulo}</h3>
                      <p className="text-xs font-bold text-blue-600 mt-0.5">{ley.sub}</p>
                    </div>

                    <p className="text-xs sm:text-sm text-slate-700 italic bg-slate-50 p-3.5 rounded-2xl border border-slate-100 leading-relaxed">
                      "{ley.enunciado}"
                    </p>

                    <div className="pt-2">
                      <span className="text-xs font-bold text-slate-900 uppercase tracking-wider block mb-1">
                        👉 Aplicación Práctica en la Sesión:
                      </span>
                      <p className="text-xs sm:text-sm text-slate-600 leading-relaxed">
                        {ley.aplicacion}
                      </p>
                    </div>
                  </div>
                ))}
              </div>

              {/* LLAMADO A LA ACCIÓN DESDE LAS LEYES */}
              <div className="bg-slate-900 text-white rounded-3xl p-6 sm:p-8 shadow-sm text-center space-y-4">
                <h3 className="text-lg sm:text-xl font-bold text-white">
                  Comprender la Lógica de Tu Cuerpo es el Primer Paso para Sanar
                </h3>
                <p className="text-xs sm:text-sm text-slate-300 max-w-lg mx-auto leading-relaxed">
                  Cuando dejas de pelear con el síntoma y comprendes la Ley Biológica que lo sostiene, el miedo desaparece y recuperas tu capacidad de respuesta.
                </p>
                <div className="pt-2">
                  <button
                    onClick={() => setTab('escaner')}
                    className="px-6 py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-xs sm:text-sm shadow-md transition-all"
                  >
                    Escanear Mi Síntoma Ahora →
                  </button>
                </div>
              </div>

            </div>
          )}

          {/* PESTAÑA 4: MÉTODO & SESIÓN 1 A 1 (INFORMACIÓN DEL SITIO WEB) */}
          {tab === 'metodo' && (
            <div className="space-y-6">
              
              {/* DIAGNÓSTICO EN BIODESCODIFICACIÓN */}
              <div className="bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-sm space-y-4">
                <span className="text-xs font-bold tracking-widest text-blue-600 uppercase block">
                  Enfoque Clínico Integrativo
                </span>
                <h2 className="text-xl sm:text-2xl font-bold text-slate-900">
                  Trabajamos sobre situaciones CON DIAGNÓSTICO
                </h2>
                <p className="text-xs sm:text-sm text-slate-600 leading-relaxed">
                  En biodescodificación no adivinamos ni diagnosticamos. Partimos de una mirada integrativa: la persona acude con un <strong className="text-slate-900">diagnóstico médico o clínico previo</strong>[cite: 5, 20]. A partir de allí, profundizamos en qué experiencias, emociones, creencias y aprendizajes inconscientes se asocian con la manera en que estás viviendo ese conflicto[cite: 5].
                </p>
                <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100 text-xs text-slate-700 leading-relaxed">
                  💡 <strong className="text-slate-900">Importante:</strong> La biodescodificación no reemplaza el tratamiento médico o psicológico; lo amplía y complementa al comprender la raíz biológica y emocional de lo que experimentas[cite: 6, 20].
                </div>
              </div>

              {/* PROCESO DE LA SESIÓN EN 5 PASOS */}
              <div className="bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-sm space-y-6">
                <div>
                  <span className="text-xs font-bold tracking-widest text-blue-600 uppercase block mb-1">
                    El Protocolo
                  </span>
                  <h3 className="text-lg sm:text-xl font-bold text-slate-900">
                    ¿Cómo es una Sesión Privada 1 a 1?
                  </h3>
                  <p className="text-xs sm:text-sm text-slate-500 mt-1">
                    Un encuentro privado por videollamada orientado a encontrar el conflicto que dio origen a lo que hoy vives.
                  </p>
                </div>

                <div className="space-y-3">
                  {[
                    { num: "01", titulo: "Situación de estrés", desc: "Identificamos el hecho concreto que hoy te tiene en conflicto o reactiva el síntoma." },
                    { num: "02", titulo: "Sentimiento y emoción oculta", desc: "Reconocemos qué emoción quedó atrapada bajo esa vivencia imprevista." },
                    { num: "03", titulo: "Creencia limitante", desc: "Descubrimos la idea aprendida o heredada que sostiene tu modo de reaccionar en piloto automático." },
                    { num: "04", titulo: "Reimpronta", desc: "Trabajamos una nueva impresión emocional y biológica frente al mismo hecho." },
                    { num: "05", titulo: "Seguimiento post sesión", desc: "Te llevas un protocolo práctico para aplicar desde el primer día y sostener el cambio." }
                  ].map((pasoItem) => (
                    <div key={pasoItem.num} className="bg-slate-50 border border-slate-100 rounded-2xl p-4 flex gap-4 items-start">
                      <span className="text-lg font-extrabold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-xl border border-blue-100 shrink-0">
                        {pasoItem.num}
                      </span>
                      <div>
                        <h4 className="text-sm font-bold text-slate-900">{pasoItem.titulo}</h4>
                        <p className="text-xs text-slate-600 leading-relaxed mt-0.5">{pasoItem.desc}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* QUIÉN TE ACOMPAÑA & AGENDAMIENTO */}
              <div className="bg-slate-900 text-white rounded-3xl p-6 sm:p-8 shadow-sm text-center space-y-4">
                <span className="text-xs font-bold tracking-widest text-blue-400 uppercase block">
                  Acompañamiento Privado
                </span>
                <h3 className="text-xl font-bold text-white">
                  Mario Paredes · Biodescodificación
                </h3>
                <p className="text-xs sm:text-sm text-slate-300 max-w-lg mx-auto leading-relaxed">
                  "Siento que la biodescodificación es el método más efectivo y directo para transformar la forma en que pensamos y generar cambios desde el minuto 1."
                </p>

                <div className="pt-2 flex flex-col sm:flex-row gap-3 justify-center">
                  <a
                    href={`https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent('Hola Mario, leí la información de tu sitio web en la app y deseo agendar mi sesión privada 1 a 1.')}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="px-6 py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs sm:text-sm shadow-md transition-all flex items-center justify-center gap-2"
                  >
                    <span>💬</span> Agendar Mi Sesión por WhatsApp
                  </a>

                  <a
                    href="https://caminoalinconsciente.cl/"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="px-6 py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl text-xs sm:text-sm border border-slate-700 transition-all flex items-center justify-center gap-2"
                  >
                    <span>🔗</span> Visitar caminoalinconsciente.cl
                  </a>
                </div>
              </div>

            </div>
          )}

          {/* FOOTER GENERAL */}
          <footer className="mt-12 text-center text-xs text-slate-400 border-t border-slate-200 pt-6">
            <p>© {new Date().getFullYear()} Camino Al Inconsciente - Mario Paredes. Todos los derechos reservados.</p>
            <p className="mt-1 font-light">
              Acompañamiento privado para comprender el origen emocional y biológico de lo que hoy te limita.
            </p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
